# MiraTags starter definitions.
# These generic tags are available on a fresh install and can be edited/deleted
# in plugins/MiraTags/tags.yml or through MiraTags administration.
#
# permission:
#   Blank means the tag is controlled by MiraTags grants/default-unlocked state.
#   Set a permission node to make ownership permission-based.
#
# suffix:
#   This is supplied to LuckPerms as the active suffix. Include spacing exactly
#   how you want it to appear after the player's name.

tags:
  og:
    enabled: true
    display-name: "&6OG"
    suffix: " &8[&6OG&8]"
    icon: NAME_TAG
    permission: "miratags.tag.og"
    default-unlocked: true
    sort-order: 10
    description:
      - "&7A simple classic tag."

