name: MiraTags
version: 0.1.5
main: com.mira.tags.MiraTagsPlugin
api-version: '1.21'
authors: [FiveS]
description: GUI-first tags with milestone achievements, seasonal unlocks and timed ownership.
depend: [MiraCore, LuckPerms]

commands:
  tags:
    description: Open the MiraTags selector.
    usage: /tags
    permission: miratags.use
  miratags:
    description: MiraTags administration and diagnostics.
    usage: /miratags <create|add|delete|grant|revoke|clear|list|reload|test|help>
    aliases: [mtags, mtag]
    permission: miratags.admin
  mtagtime:
    description: Grant a tag for a limited duration.
    usage: /mtagtime <player> <tag> <30m|12h|7d>
    permission: miratags.admin

permissions:
  miratags.use:
    description: Allows opening and using the tags GUI.
    default: true
  miratags.admin:
    description: Allows MiraTags administration commands.
    default: op
