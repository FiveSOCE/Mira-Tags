name: Release v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 62ea18dfd0f713cf977e279120d7b5c0b53d38a1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            build/libs/MiraTags-0.1.0.jar \
            --target 62ea18dfd0f713cf977e279120d7b5c0b53d38a1 \
            --title "MiraTags v0.1.0" \
            --notes "Initial MiraTags release for Paper 1.21.11 and Java 21. Adds a paginated /tags selector GUI, one active tag at a time, persistent internal unlocks and selections, optional permission/default unlocks, LuckPerms suffix integration using a reserved managed priority, admin grant/revoke/clear/list/reload/test commands, MiraCore module registration, and a public MiraTags API for future Crates/Kits/Shop integrations."
