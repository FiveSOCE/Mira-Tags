name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiraTags-0.1.5
          path: build/libs/MiraTags-0.1.5.jar
          if-no-files-found: error

      - name: Publish v0.1.5 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.5 >/dev/null 2>&1; then
            gh release create v0.1.5 \
              build/libs/MiraTags-0.1.5.jar \
              --target "${{ github.sha }}" \
              --title "MiraTags v0.1.5" \
              --notes "Synchronizes all tag definitions into LuckPerms backing groups from startup, gives every starter tag a real miratags.tag.<id> permission, normalizes the GUI to NAME_TAG items and renders the actual styled in-game tag suffix as the item name."
          fi
