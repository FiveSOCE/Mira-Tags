name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Upload plugin jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiraTags-0.1.7
          path: build/libs/MiraTags-0.1.7.jar
          if-no-files-found: error

      - name: Publish v0.1.7 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.7 >/dev/null 2>&1; then
            gh release create v0.1.7 \
              build/libs/MiraTags-0.1.7.jar \
              --target "${{ github.sha }}" \
              --title "MiraTags v0.1.7" \
              --notes "Hotfixes tag equip so /tags dispatches LuckPerms from console using lp user <username> meta addsuffix 0 <suffix>, cleans legacy MiraTags suffix nodes safely when switching/clearing, and preserves active selections owned through default unlocks or LuckPerms permissions."
          fi
