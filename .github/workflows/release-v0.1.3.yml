name: Release v0.1.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 9be3cc5a81a932e2765c2cabbb5f6fd5928cc8b2

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.3 \
            build/libs/MiraTags-0.1.3.jar \
            --target 9be3cc5a81a932e2765c2cabbb5f6fd5928cc8b2 \
            --title "MiraTags v0.1.3" \
            --notes "Makes create, add and delete explicit MiraTags admin subcommands. /mtags create <Tag Name> is now the preferred creation command, /mtags add remains an alias, and /mtags delete plus /mtag delete remain supported. Help, usage and tab completion now expose all three clearly."
