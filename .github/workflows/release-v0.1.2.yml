name: Release v0.1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 064cfd258aec6bcffc503e945eb7e942a0bc6c5c

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.2 \
            build/libs/MiraTags-0.1.2.jar \
            --target 064cfd258aec6bcffc503e945eb7e942a0bc6c5c \
            --title "MiraTags v0.1.2" \
            --notes "Adds /mtag delete <tag> and /mtags delete <tag>. Deleting a tag removes its persistent tags.yml definition, purges MiraTags internal grants and active selections, and immediately refreshes online players so deleted suffixes disappear. External LuckPerms permission assignments are intentionally left untouched. Also adds /mtag as an admin-command alias."
