name: Release v0.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: 30568f09c754274902ce61fd17a21d1958794df6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Test and build
        run: gradle clean test build --stacktrace

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.1 \
            build/libs/MiraTags-0.1.1.jar \
            --target 30568f09c754274902ce61fd17a21d1958794df6 \
            --title "MiraTags v0.1.1" \
            --notes "Adds /mtags add <Tag Name> with private chat format capture. The next chat message is cancelled, saved as the new persistent tag suffix, and the tag is immediately available to the GUI, grants and API. In-game-created tags automatically receive a LuckPerms backing permission miratags.tag.<id>. Type cancel during chat input to abort."
